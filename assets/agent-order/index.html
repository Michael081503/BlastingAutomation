<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RECO agent order</title>
    <link rel="stylesheet" href="./reco-agent-order.css">
</head>
<body>
    <ol class="agent-list" aria-label="RECO agent assignment order"></ol>
    <p class="status" role="status" aria-live="polite"></p>
    <script type="module">
        import createAgentOrder from './reco-agent-order.js';

        function send(type, payload = {}) {
            window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, '*');
        }
        const update = createAgentOrder({
            parentElement: document,
            onOrderChange: value => send('streamlit:setComponentValue', { value, dataType: 'json' }),
        });
        window.addEventListener('message', event => {
            if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
            const { args, theme } = event.data;
            for (const [name, value] of Object.entries(theme || {})) {
                const cssName = name.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`);
                document.documentElement.style.setProperty(`--st-${cssName}`, value);
            }
            update(args.data, args.revision, args.save_error);
        });
        let lastHeight = 0;
        new ResizeObserver(() => {
            const height = document.body.scrollHeight + 4;
            if (height !== lastHeight) {
                lastHeight = height;
                send('streamlit:setFrameHeight', { height });
            }
        }).observe(document.body);
        send('streamlit:componentReady', { apiVersion: 1 });
    </script>
</body>
</html>
