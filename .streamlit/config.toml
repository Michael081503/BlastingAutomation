[server]
headless = true
maxUploadSize = 200
# Production deployments restart to load code updates; avoid module-cache eviction
# by background file watchers while another browser session is importing modules.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#E5BD78"
backgroundColor = "#0B1917"
secondaryBackgroundColor = "#182C26"
textColor = "#F7F3E9"
linkColor = "#FFDCA0"
borderColor = "#405C4F"
dataframeHeaderBackgroundColor = "#203930"
showWidgetBorder = true
baseRadius = "medium"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#10211D"
secondaryBackgroundColor = "#1B312A"
