[server]
headless = true
maxUploadSize = 200
# Production deployments restart to load code updates; avoid module-cache eviction
# by background file watchers while another browser session is importing modules.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#C84350"
backgroundColor = "#071D20"
secondaryBackgroundColor = "#112D2B"
textColor = "#F4F8F5"
font = "sans serif"
