[server]
headless = true
maxUploadSize = 200
# Production deployments restart to load code updates; avoid module-cache eviction
# by background file watchers while another browser session is importing modules.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#F6923F"
backgroundColor = "#0F0C16"
secondaryBackgroundColor = "#211B2C"
textColor = "#F6F1FC"
font = "sans serif"
